<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f0c">
<title>Proto D20 — physique cannon-es</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='32,6 54,32 32,58 10,32' fill='%232f6fed'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<style>
#protoBar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 6px;font-weight:800;font-size:15px}
#protoBar a{color:#ffd76a;font-size:13px;font-weight:600}
</style>
</head>
<body>

<header id="pickerBar">
  <div id="protoBar"><span>PROTO · D20 · cannon-es (résultat = face du dessus)</span><a href="index.html">← retour</a></div>
</header>

<main id="stage">
  <div id="frame">
    <div id="tray" aria-label="Tapis de dés">
      <button id="helpBtn" aria-label="Aide">?</button>
      <div id="toast" role="status"></div>
    </div>
  </div>
</main>

<footer id="actionbar">
  <button id="clearBtn" class="act ghost">🗑 <span>Vider</span></button>
  <div id="total" hidden></div>
  <button id="rollBtn" class="act primary">🎲 <span>Lancer</span></button>
</footer>

<div id="helpModal" class="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="hTitle">
    <h2 id="hTitle">Prototype physique</h2>
    <ul>
      <li>🎲 <b>Lancer</b> : coup de pied physique (conditions initiales crypto)</li>
      <li>Résultat = <b>face du dessus</b> à l'arrêt — aucun tirage en amont</li>
      <li>🗑 <b>Vider</b> : repose le dé au centre</li>
    </ul>
    <div class="row"><button id="hClose" class="btn">Fermer</button></div>
  </div>
</div>

<script type="module" src="js/proto-d20.js"></script>
</body>
</html>
